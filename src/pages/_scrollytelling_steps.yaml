        fill-extrusion-opacity: 1

- title: 1985 Anti-Apartheid SouthAfrica Protests
  center: [-73.9670, 40.8085]
  zoom: 15.7
  pitch: 0
  bearing: 20
  description: |
    Columbia students demanded divestment from companies supporting apartheid South Africa, at a time when nearly 20 trustees were involved with businesses operating there. 
    Columbia later became the first Ivy League institution to divest, following strong student dissent, including building occupations and fasting.
