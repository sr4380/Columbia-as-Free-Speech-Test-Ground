- title: Conclusion
  style: '/style.json'
  center: [-74.100, 40.7800]
  zoom: 11
  pitch: 0
  bearing: 0
  description: |
    If more than a century after Columbia's first major speech controversies,
    the ability to expose, criticize and confront oppressive regimes on campus and in the classroom remains disputed,
    Free to Speak asks: what forms of expression might solidarity take next?
